name: terpiez
description: "Location-based mobile game: find and catch Terpiez around you."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  geolocator: ^12.0.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  redis: ^3.0.0
  path_provider: ^2.1.0
  sensors_plus: ^6.0.0
  flutter_local_notifications: ^18.0.0
  flutter_background_service: ^5.0.0
  flutter_background_service_android: ^6.2.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/sounds/